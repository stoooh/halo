[package]
name = "halo"
version = "0.9.0"
description = "Menu radiale per azioni rapide sui file"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
dirs = "6"
trash = "5"
open = "5"
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

tauri-plugin-dialog = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# Più file scelti in Esplora file avviano Halo una volta per file: la prima istanza li raccoglie tutti.
tauri-plugin-single-instance = "2"
# Il PATH aggiornato dal registro (programmi appena installati).
winreg = "0.55"
# Alt+clic in Esplora file (altclic_win.rs): aggancio del mouse e selezione delle finestre;
# la finestra di Halo che ignora il menu di Alt (main.rs); il pannello «Condividi» (sistema.rs).
windows = { version = "0.62", features = [
  "ApplicationModel_DataTransfer", "Foundation_Collections", "Storage", "Storage_Streams",
  "Win32_Foundation", "Win32_Security", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_System_Ole",
  "Win32_System_Threading", "Win32_System_Variant", "Win32_UI_Accessibility", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_Shell_Common",
  "Win32_UI_WindowsAndMessaging",
] }
# L'elenco di file passato al pannello «Condividi» (IIterable, usato da windows ma non riesportato).
windows-collections = "0.3"
