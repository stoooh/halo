[package]
name = "halo"
version = "0.8.1"
description = "Menu radiale per azioni rapide sui file"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
dirs = "6"
trash = "5"
open = "5"
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

tauri-plugin-dialog = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# Più file scelti in Esplora file avviano Halo una volta per file: la prima istanza li raccoglie tutti.
tauri-plugin-single-instance = "2"
# Il PATH aggiornato dal registro (programmi appena installati).
winreg = "0.55"
# Alt+clic: hook del mouse di Windows.
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }
