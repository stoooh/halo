# Crea l'installer di Halo per Windows (NSIS) su un computer Windows di GitHub.
# Si avvia a mano da GitHub (Actions › Windows › Run workflow) o con un tag «v…».
# L'installer si scarica dalla pagina dell'esecuzione, in «Artifacts».
name: Windows

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Compila e crea l'installer
        run: npx --yes @tauri-apps/cli@2.12.4 build
      - uses: actions/upload-artifact@v4
        with:
          name: Halo-Windows
          path: src-tauri/target/release/bundle/nsis/*.exe
