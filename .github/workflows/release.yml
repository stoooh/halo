# Crea gli installer di Halo per Linux (.deb + installa-halo.sh) e per Windows (setup .exe).
# - Con un tag «v…» (es. v0.8.0) li pubblica in una release di GitHub.
# - A mano (Actions › Installer › Run workflow) li lascia in «Artifacts» dell'esecuzione.
name: Installer

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Librerie per compilare Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Compila e crea il pacchetto .deb
        run: npx --yes @tauri-apps/cli@2.12.4 build
      - uses: actions/upload-artifact@v4
        with:
          name: Halo-Linux
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            installa-halo.sh

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Compila e crea l'installer
        run: npx --yes @tauri-apps/cli@2.12.4 build
      - uses: actions/upload-artifact@v4
        with:
          name: Halo-Windows
          path: src-tauri/target/release/bundle/nsis/*.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Pubblica la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "Halo $GITHUB_REF_NAME" \
            --notes "Linux (Ubuntu/GNOME): scarica Halo_*_amd64.deb e installa-halo.sh nella stessa cartella, poi: bash installa-halo.sh. Windows 10/11: avvia Halo_*_x64-setup.exe e rispondi Sì per installare i programmi necessari." \
            $(find dist -type f \( -name '*.deb' -o -name '*.exe' -o -name 'installa-halo.sh' \))
